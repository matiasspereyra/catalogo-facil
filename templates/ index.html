<!DOCTYPE html>
<html>
<head>
  <title>Tienda Celulares Formosa</title>
  <style>
    body { font-family: Arial; background: #f2f2f2; }
   .grid { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
   .card { background: white; border-radius: 10px; padding: 15px; width: 220px; box-shadow: 0 2px 5px #ccc; }
   .card h3 { margin: 0; }
   .precio { color: green; font-weight: bold; font-size: 18px; }
   .stock { color: gray; }
  </style>
</head>
<body>
  <h1 style="text-align:center">📱 Mi Tienda de Celulares</h1>
  <div class="grid">
    {% for p in productos %}
    <div class="card">
      <h3>{{ p[0] }} {{ p[1] }}</h3>
      <p class="precio">${{ p[2] }}</p>
      <p class="stock">Stock: {{ p[3] }}</p>
      <button>Comprar</button>
    </div>
    {% endfor %}
  </div>
</body>
</html>
